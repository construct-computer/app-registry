name = "construct-app-registry"
main = "src/index.ts"
compatibility_date = "2024-12-01"

routes = [
  { pattern = "registry.construct.computer", custom_domain = true },
  # Per-app subdomains: each published app is served at
  # `${id}-${nanoid}.apps.construct.computer`. The wildcard lives one
  # level deep (under `apps`) so it never collides with first-level
  # construct hostnames like `staging.construct.computer` or
  # `beta.construct.computer` (which belong to the construct worker
  # via custom_domain). Requires a wildcard DNS record
  # `*.apps.construct.computer` (proxied) so all sub-subdomains reach
  # this worker.
  { pattern = "*.apps.construct.computer/*", zone_name = "construct.computer" },
]

[vars]
ENVIRONMENT = "production"
# Grafana Cloud OTLP credentials are set as secrets via `wrangler secret put`.
# GRAFANA_OTLP_ENDPOINT — the Grafana Cloud OTLP endpoint URL
# GRAFANA_OTLP_AUTH    — the Authorization header value, e.g. "Basic <base64>"

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

[[d1_databases]]
binding = "DB"
database_name = "app-registry"
database_id = "9d832b01-d540-4564-a6e1-337fb199f4d2"
migrations_dir = "src/migrations"
